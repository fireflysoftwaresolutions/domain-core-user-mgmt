openapi: 3.0.3
info:
  title: Domain User Management API
  version: 26.10.6
paths:
  /api/v1/accounts/{id}:
    get:
      tags: [User Accounts]
      operationId: read
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: User account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccountView"
    put:
      tags: [User Accounts]
      operationId: update
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAccountDraft"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredUserAccount"
  /api/v1/accounts:
    post:
      tags: [User Accounts]
      operationId: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAccountDraft"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredUserAccount"
components:
  schemas:
    UserAccountView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
    UserAccountDraft:
      type: object
      additionalProperties: true
    StoredUserAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        body:
          $ref: "#/components/schemas/UserAccountDraft"
