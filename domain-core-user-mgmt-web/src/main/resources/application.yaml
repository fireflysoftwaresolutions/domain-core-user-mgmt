spring:
  application:
    name: domain-core-user-mgmt
server:
  port: ${SERVER_PORT:18126}
firefly:
  eda:
    enabled: false
  stepevents:
    enabled: false
  user:
    account:
      adapter: sandbox
      core-base-url: http://localhost:8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
